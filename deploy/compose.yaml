name: quorum

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: caddy-runtime
    restart: unless-stopped
    environment:
      QUORUM_SITE_ADDRESS: ${QUORUM_SITE_ADDRESS}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app-runtime
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: 3000
      QUORUM_VERSION: ${QUORUM_VERSION:-0.1.0-self-hosted}
      QUORUM_MIGRATIONS_DIR: /app/server/migrations
      QUORUM_STORAGE_PATH: /var/lib/quorum/files
    volumes:
      - quorum_files:/var/lib/quorum/files
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 15s
    mem_limit: 512m
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 768m
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  quorum_files:
  postgres_data:
