[package]
name = "quorum-storage-agent-desktop"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
slint = { version = "=1.17.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2", "unstable-winit-030"] }
serde_json = "1"
rfd = "0.15"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_IO", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Globalization"] }

[build-dependencies]
slint-build = "=1.17.1"

[profile.release]
lto = "thin"
strip = true
