name: Integration Tests

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  postgres_api:
    name: PostgreSQL and API integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/postgres

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run self-hosted tests
        run: pnpm test:self-host

      - name: Run PostgreSQL integration tests
        run: pnpm test:self-host:integration

      - name: Build production artifacts
        run: pnpm build:self-host
