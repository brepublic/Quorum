name: Build Windows Chair Agent

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'packages/storage-agent/**'
      - 'packages/storage-agent-desktop/**'
      - 'packages/contracts/**'
      - 'scripts/*storage-agent*'
      - 'scripts/windows/**'
      - 'scripts/appimage/**'
      - 'scripts/wsl-env.sh'
      - '.github/workflows/build-chair-agent*.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  push:
    branches: [master, windows-agent]
    paths:
      - 'packages/storage-agent/**'
      - 'packages/storage-agent-desktop/**'
      - 'packages/contracts/**'
      - 'scripts/*storage-agent*'
      - 'scripts/windows/**'
      - 'scripts/appimage/**'
      - 'scripts/wsl-env.sh'
      - '.github/workflows/build-chair-agent*.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Install fixed pnpm and Rust
        shell: pwsh
        run: |
          npm install --global pnpm@10.33.4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup toolchain install 1.98.1 --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustup default 1.98.1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Agent and release behavior
        shell: pwsh
        run: |
          $env:PATH = 'C:\Program Files\Git\usr\bin;' + $env:PATH
          pnpm --filter @quorum/contracts build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter @quorum/storage-agent build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo build --locked --manifest-path packages/storage-agent-desktop/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:QUORUM_AGENT_PLATFORM = (Resolve-Path 'packages/storage-agent-desktop/target/debug/quorum-agent-platform.exe').Path
          $env:QUORUM_AGENT_NODE = (Get-Command node.exe).Source
          pnpm exec vitest run scripts/storage-agent-release.test.ts scripts/storage-agent-windows-release.test.ts packages/storage-agent/src
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked --manifest-path packages/storage-agent-desktop/Cargo.toml --bins
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build ZIP, corresponding source and user installer
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/package-storage-agent-windows.ps1 -UseSystemTools
      - name: Check isolated packaged runtime and installer lifecycle
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/smoke.ps1 -Artifacts release/windows -IncludeInstaller
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && hashFiles('release/windows/release-manifest.json') != '' }}
        with:
          name: quorum-chair-agent-windows-x64
          path: |
            release/windows/*.zip
            release/windows/*-Setup.exe
            release/windows/SHA256SUMS
            release/windows/release-manifest.json
            release/windows/PE-DEPENDENCIES.json
            release/windows/smoke-results.json
            release/windows/*.log
          if-no-files-found: error

  linux-regression:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build and verify complete Linux GUI and AppImage
        run: bash scripts/package-storage-agent-appimage.sh
      - uses: actions/upload-artifact@v4
        with:
          name: quorum-chair-agent-linux-regression
          path: release/appimage/
          if-no-files-found: error
