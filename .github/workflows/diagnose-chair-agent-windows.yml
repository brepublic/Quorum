name: Diagnose packaged Windows Chair Agent

on:
  push:
    branches: [windows-agent]
    paths: ['.github/workflows/diagnose-chair-agent-windows.yml']

permissions:
  contents: read
  actions: read

jobs:
  installer:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download the verified e960769 Windows release
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39043178792
          name: quorum-chair-agent-windows-x64
          path: release/windows
      - name: Replay packaged runtime and installer lifecycle
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts/windows/smoke.ps1 -Artifacts release/windows -IncludeInstaller
      - name: Preserve smoke diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-diagnostics
          path: |
            release/windows/smoke-results.json
            release/windows/*.log
          if-no-files-found: ignore
